<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖經路線地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#222; --muted:#666; --line:#ddd; --accent:#b4432a; --hover:#f6efe9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --line:#3a3a3a; --accent:#ff8a6b; --hover:#2c2623; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui, "Noto Sans TC", sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:320px; max-width:45%; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #head { padding:12px; border-bottom:1px solid var(--line); }
  #head h1 { font-size:16px; margin:0 0 8px; }
  #q { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); }
  #tools { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; color:var(--muted); }
  #tools label, #tools button { white-space:nowrap; }
  #tools button { border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:4px; padding:3px 8px; cursor:pointer; }
  #play { margin-top:8px; display:flex; gap:8px; align-items:center; color:var(--muted); }
  #play button { border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:4px; padding:3px 10px; cursor:pointer; }
  #play button:disabled { opacity:.5; cursor:default; }
  #playname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid; color:#222;
    font:700 11px/16px system-ui; text-align:center; }
  .runner { width:16px; height:16px; border-radius:50%; background:#ffd400; border:3px solid #222; }
  #list { flex:1; overflow:auto; }
  .grp { position:sticky; top:0; background:var(--bg); padding:6px 12px; font-weight:600;
    border-bottom:1px solid var(--line); color:var(--accent); }
  .item { padding:6px 12px; cursor:pointer; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .item:hover { background:var(--hover); }
  .item.on { background:var(--hover); box-shadow:inset 3px 0 var(--accent); }
  .item .t small { display:block; color:var(--muted); font-size:12px; }
  .item .n { color:var(--muted); min-width:2.5em; font-variant-numeric:tabular-nums; }
  #foot { padding:8px 12px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  #foot a { color:inherit; }
  #map { flex:1; }
  @media (max-width:640px) {
    #app { flex-direction:column-reverse; }
    #side { width:100%; max-width:none; height:45%; border-right:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="head">
      <h1>聖經路線地圖</h1>
      <input id="q" type="search" placeholder="搜尋路線(中文、英文或編號)">
      <div id="tools">
        <label><input id="all" type="checkbox"> 顯示全部</label>
        <label><input id="arrows" type="checkbox" checked> 箭頭</label>
        <label><input id="nums" type="checkbox" checked> 編號</label>
        <button id="clear">清除</button>
        <span id="count"></span>
      </div>
      <div id="play">
        <button id="playbtn" disabled>▶ 播放</button>
        <span id="playname">先點選一條路線</span>
      </div>
    </div>
    <div id="list"></div>
    <div id="foot">
      路線資料 © United Bible Societies 2023,路線製作:Leen Ritmeyer。
      <a href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<script src="routes.js"></script>
<script>
const map = L.map("map").setView([32, 36], 6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "© OpenStreetMap contributors"
}).addTo(map);

const palette = ["#b4432a", "#2a6fb4", "#2a8f5a", "#8a4fb4", "#c48a1a", "#1a8f9c", "#b42a6f"];
const groups = [...new Set(ROUTES.map(r => r.group))];
const colorOf = r => palette[groups.indexOf(r.group) % palette.length];

const layers = new Map();   // route id -> L.layerGroup
const selected = new Set();

function layerFor(r) {
  if (!layers.has(r.id)) {
    const g = L.layerGroup();
    const color = colorOf(r);
    r.lines.forEach(pts => {
      L.polyline(pts, { color, weight: 4, opacity: 0.85 }).bindTooltip(`${r.num}. ${r.zh || r.name}`, { sticky: true }).addTo(g);
    });
    const arrows = [], nums = [];
    r.lines.forEach((pts, i) => {
      arrows.push(L.polylineDecorator(L.polyline(pts), { patterns: [{
        offset: 40, repeat: 90,
        symbol: L.Symbol.arrowHead({ pixelSize: 11, polygon: false,
          pathOptions: { color: "#fff", weight: 2.5, opacity: 0.95 } })
      }] }));
      if (r.lines.length > 1) {
        nums.push(L.marker(pts[0], { interactive: false, icon: L.divIcon({
          className: "", iconSize: [20, 20],
          html: `<div class="badge" style="border-color:${color}">${i + 1}</div>` }) }));
      }
    });
    g.arrows = arrows; g.nums = nums;
    const first = r.lines[0][0], lastLine = r.lines[r.lines.length - 1];
    const last = lastLine[lastLine.length - 1];
    L.circleMarker(first, { radius: 6, color: "#fff", weight: 2, fillColor: "#2a8f5a", fillOpacity: 1 })
      .bindTooltip("起點").addTo(g);
    L.circleMarker(last, { radius: 6, color: "#fff", weight: 2, fillColor: "#c0392b", fillOpacity: 1 })
      .bindTooltip("終點").addTo(g);
    layers.set(r.id, g);
    applyOptions(g);
  }
  return layers.get(r.id);
}

function applyOptions(g) {
  const on = (list, show) => list.forEach(l => show ? g.addLayer(l) : g.removeLayer(l));
  on(g.arrows, document.getElementById("arrows").checked);
  on(g.nums, document.getElementById("nums").checked);
}
["arrows", "nums"].forEach(id =>
  document.getElementById(id).addEventListener("change", () => layers.forEach(applyOptions)));

// ---- playback: a marker walks the segments in file order ----
let current = null, anim = null;
const playBtn = document.getElementById("playbtn");

function setCurrent(r) {
  stopPlay(true);
  current = r;
  playBtn.disabled = !r;
  document.getElementById("playname").textContent = r ? `${r.num}. ${r.zh || r.name}` : "先點選一條路線";
}

function stopPlay(reset) {
  if (anim) { cancelAnimationFrame(anim.raf); map.removeLayer(anim.trail); map.removeLayer(anim.runner); anim = null; }
  playBtn.textContent = "▶ 播放";
}

function startPlay() {
  // Each segment is one leg. A gap bigger than ~0.3 degrees between legs is not drawn:
  // the runner jumps to the next leg instead of cutting across the map.
  const legs = current.lines;
  const lens = legs.map(pts => pts.slice(1).reduce((a, p, k) => a + map.distance(pts[k], p), 0));
  const total = lens.reduce((a, b) => a + b, 0) || 1;
  const duration = Math.min(20000, Math.max(6000, total / 100)); // ~100 m per ms, clamped
  const trail = L.polyline([], { color: "#ffd400", weight: 6, opacity: 0.9 }).addTo(map);
  const runner = L.marker(legs[0][0], { interactive: false, icon: L.divIcon({ className: "", iconSize: [16, 16], html: '<div class="runner"></div>' }) }).addTo(map);
  const t0 = performance.now();
  anim = { trail, runner };
  playBtn.textContent = "■ 停止";
  const step = now => {
    let d = Math.min(1, (now - t0) / duration) * total;
    const done = [];
    let p = legs[0][0];
    for (let li = 0; li < legs.length; li++) {
      const pts = legs[li];
      if (d >= lens[li] && li < legs.length - 1) { done.push(pts); d -= lens[li]; continue; }
      const part = [pts[0]];
      let acc = 0, pos = pts[0];
      for (let k = 1; k < pts.length; k++) {
        const seg = map.distance(pts[k - 1], pts[k]);
        if (acc + seg >= d) {
          const f = (d - acc) / (seg || 1);
          pos = [pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * f, pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * f];
          part.push(pos);
          break;
        }
        acc += seg; part.push(pts[k]); pos = pts[k];
      }
      done.push(part); p = pos;
      break;
    }
    trail.setLatLngs(done);
    runner.setLatLng(p);
    if (now - t0 < duration) anim.raf = requestAnimationFrame(step);
    else playBtn.textContent = "▶ 重播";
  };
  anim.raf = requestAnimationFrame(step);
}

playBtn.onclick = () => { if (!current) return; if (anim && playBtn.textContent.startsWith("■")) stopPlay(); else { stopPlay(); startPlay(); } };

function boundsOf(rs) {
  return L.latLngBounds(rs.flatMap(r => r.lines.flat()));
}

const listEl = document.getElementById("list");
const rows = new Map();

function render(filter = "") {
  const f = filter.trim().toLowerCase();
  listEl.innerHTML = "";
  rows.clear();
  let n = 0;
  groups.forEach(g => {
    const rs = ROUTES.filter(r => r.group === g && (!f || `${r.num} ${r.zh} ${r.name}`.toLowerCase().includes(f)));
    if (!rs.length) return;
    const h = document.createElement("div");
    h.className = "grp";
    h.textContent = g;
    listEl.appendChild(h);
    rs.forEach(r => {
      const el = document.createElement("div");
      el.className = "item" + (selected.has(r.id) ? " on" : "");
      el.innerHTML = `<span class="n">${r.num}</span><span class="t"></span>`;
      const t = el.lastChild;
      t.append(r.zh || r.name);
      if (r.zh) {
        const en = document.createElement("small");
        en.textContent = r.name;
        t.appendChild(en);
      }
      el.onclick = () => toggle(r, true);
      listEl.appendChild(el);
      rows.set(r.id, el);
      n++;
    });
  });
  document.getElementById("count").textContent = `${n} 條`;
}

function toggle(r, fit) {
  const g = layerFor(r);
  if (selected.has(r.id)) {
    selected.delete(r.id);
    map.removeLayer(g);
  } else {
    selected.add(r.id);
    g.addTo(map);
    if (fit) map.fitBounds(boundsOf([r]), { padding: [40, 40] });
    setCurrent(r);
  }
  rows.get(r.id)?.classList.toggle("on", selected.has(r.id));
}

function clearAll() {
  setCurrent(null);
  selected.forEach(id => map.removeLayer(layers.get(id)));
  selected.clear();
  rows.forEach(el => el.classList.remove("on"));
  document.getElementById("all").checked = false;
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
document.getElementById("clear").onclick = clearAll;
document.getElementById("all").onchange = e => {
  clearAll();
  if (e.target.checked) {
    ROUTES.forEach(r => { selected.add(r.id); layerFor(r).addTo(map); });
    rows.forEach(el => el.classList.add("on"));
    map.fitBounds(boundsOf(ROUTES), { padding: [20, 20] });
    document.getElementById("all").checked = true;
  }
};

render();
</script>
</body>
</html>
